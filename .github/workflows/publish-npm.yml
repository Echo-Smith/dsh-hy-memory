name: publish-npm

# Publishes to the public npm registry when a version tag is pushed. Add an npm
# token once as the repository secret NPM_TOKEN (classic "Automation", or a
# granular token allowed to create this package). Without a usable token the tag
# run stays green and says why instead of reddening the tag.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check credentials
        id: auth
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN is not configured; skipping npm publish"
            exit 0
          fi
          if npm whoami --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN is not accepted by registry.npmjs.org; skipping npm publish"
          fi
      - name: Stage and publish
        if: steps.auth.outputs.ready == 'true'
        run: |
          node scripts/prepare-publish.mjs --staging dist/npm-package
          npm publish ./dist/npm-package --registry https://registry.npmjs.org
