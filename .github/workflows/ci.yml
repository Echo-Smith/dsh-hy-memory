name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: syntax
        run: npm run check
      - name: host tests
        run: npm test
      - name: panel smoke
        run: npm run test:smoke
      - name: recall evaluation
        run: npm run eval:recall
