name: publish-github-packages

# Publishes the scoped package to GitHub Packages, which is what makes it show up
# under the repository's Packages tab. npmjs still gets the unscoped build from
# the release process; this one is scoped so GitHub can attribute it to the owner.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        required: false
        default: 0.1.1
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - name: Stage the scoped package
        run: node scripts/prepare-publish.mjs --name @echo-smith/dsh-hy-memory --version "${{ github.event.inputs.version || '0.1.1' }}" --staging dist/gh-package --registry https://npm.pkg.github.com
      - name: Publish to GitHub Packages
        run: npm publish ./dist/gh-package --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
